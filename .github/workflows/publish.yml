# 推送到 v* 标签时自动发布到 npm，走 trusted publishing（OIDC），仓库里不存任何令牌。
#
# 前置配置（npm 侧，一次性）：npmjs.com → Packages → dsh-workbuddy2api → Settings →
# Trusted publishing → GitHub Actions，绑定 FireOpalus/dsh-workbuddy2api 的
# publish.yml（只填文件名，必须带 .yml）。
#
# 三个必须遵守的坑（来自同机 dsh-laa 的实测，报错都非常有误导性）：
#
# 1. **不要给 setup-node 传 `registry-url`**。它会往 runner 的 ~/.npmrc 写
#    `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`；npm 于是拿着这个（空的）凭据
#    去发布，注册中心回 404，OIDC 根本没机会生效（actions/setup-node#1440）。
# 2. **发布前 unset NODE_AUTH_TOKEN**：npm 只要看到这个变量存在就先走 token 认证并报
#    `ENEEDAUTH`，**空串也算**，同样轮不到 OIDC。
# 3. **npm 必须 >= 11.5.1**（trusted publishing 的 OIDC 支持）。Node 24 自带的满足，
#    下面仍然显式断言一次，免得将来把 node-version 调低又变成「发了个 404」。
#
# 注意：本仓库有开发期依赖（tsdown / vitest / tsc），不能像 dsh-laa 那样只跑
# `npm test`。peerDependencies 要等宿主提供，CI 里没有宿主可解析，所以装依赖必须带
# `--legacy-peer-deps`。

name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # OIDC，trusted publishing 必需；缺了会报 ENEEDAUTH
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'             # package.json engines: ^22.19.0 || >=24.0.0
          package-manager-cache: false   # 发布构建不要用缓存

      - name: 校验 npm 版本（trusted publishing 需要 >= 11.5.1）
        run: |
          version="$(npm --version)"
          echo "npm $version"
          node -e 'const [maj, min, pat] = process.argv[1].split(".").map(Number); if (maj < 11 || (maj === 11 && (min < 5 || (min === 5 && pat < 1)))) { console.error("npm " + process.argv[1] + " 太旧：trusted publishing 需要 >= 11.5.1"); process.exit(1); }' "$version"

      - name: 校验标签与 package.json 版本一致
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 package.json 版本 $expected 不一致，拒绝发布"
            exit 1
          fi

      # 本包只把 @deepseek-ai/* 声明为 peerDependency（由宿主提供），因此这里只装
      # 开发期工具链。--ignore-scripts 跳过根 prepack：构建在下面单独跑，失败要看得见。
      - name: 安装开发期依赖
        run: npm install --no-audit --no-fund --legacy-peer-deps --ignore-scripts

      - name: 类型检查与单元测试
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.client.json --noEmit
          npx vitest run

      - name: 构建并确认提交的 lib/ 与源码一致
        run: |
          npm run build
          # lib/ 是提交进仓库的（见 .gitignore 里的说明：pnpm 对 git 依赖的构建门要求
          # 仓库里就有 main 文件）。所以必须保证它与 src 同步——忘了提交构建产物，
          # 用户装到的就是旧代码，而这里会当场失败。
          #
          # 只比内容，不比文件模式：tsdown 在 Linux 上会给 lib/bin.js 补上可执行位
          # （它有 shebang），而 Windows 检出时这个位根本不存在，一次 mode-only
          # 差异会把「产物是否过期」的检查变成假警报。真正要拦的是内容脱节。
          if ! git -c core.fileMode=false diff --exit-code --stat lib/; then
            echo "lib/ 与源码不一致：请本地 npm run build 后把 lib/ 一起提交"
            exit 1
          fi

      - name: 打包并自检产物
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
          node testenv/verify-pack.mjs

      - name: 确认 OIDC 环境可用
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "OIDC 可用：id-token: write 生效"
          else
            echo "没有 OIDC 环境变量，说明 id-token: write 没生效；trusted publishing 走不通"
            exit 1
          fi

      - name: 发布到 npm（trusted publishing；provenance 自动附加）
        run: |
          # trusted publishing 的前提是「根本没有凭据」：NODE_AUTH_TOKEN 哪怕只是空串，
          # npm 也会先走 token 认证并报 ENEEDAUTH。所以这里把它整个 unset 掉。
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          # OIDC 交换失败会被 npm 静默吞掉（只写 verbose 日志），最终只报 ENEEDAUTH，
          # 所以这里开 verbose：日志里能看到到底是「没取到 ID token」还是「交换被注册中心拒绝」。
          # provenance 在 trusted publishing 下自动附加，不需要 --provenance。
          npm publish --loglevel=verbose
